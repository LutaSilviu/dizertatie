services:

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-accessibility}
      POSTGRES_USER: ${POSTGRES_USER:-accessibility}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-accessibility}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-accessibility} -d ${POSTGRES_DB:-accessibility}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    # image will be added once the backend Docker image is built (ticket 02+)
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-accessibility}
      DB_USERNAME: ${POSTGRES_USER:-accessibility}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-accessibility}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
