spring.application.name=dizertatie

# Datasource — all connection settings come from environment variables.
# Defaults are suitable for the local docker-compose setup.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/accessibility}
spring.datasource.username=${DB_USERNAME:accessibility}
spring.datasource.password=${DB_PASSWORD:accessibility}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Spring AI — OpenAI
spring.ai.openai.api-key=${OPENAI_API_KEY:test-key}
spring.ai.openai.chat.options.temperature=0
