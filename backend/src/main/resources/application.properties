spring.application.name=dizertatie

# When the backend runs outside Docker (./mvnw spring-boot:run from backend/), read the project's
# .env so it uses the same database credentials and keys as Docker Compose. Real environment
# variables still take precedence; inside the container there is no .env and this is skipped.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Datasource — all connection settings come from environment variables.
# Defaults match docker-compose.yml, whose database is published on localhost:5432.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:dizertatie}}
spring.datasource.username=${DB_USERNAME:${POSTGRES_USER:dizertatie}}
spring.datasource.password=${DB_PASSWORD:${POSTGRES_PASSWORD:local-development-only}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Spring AI — OpenAI
spring.ai.openai.api-key=${OPENAI_API_KEY:test-key}
# Fail fast instead of retrying a slow call three times (60s x 4); a scan should not hang for minutes.
spring.ai.openai.max-retries=1
spring.ai.openai.timeout=60s

# Return {"error": ...} bodies from ApiExceptionHandler; never leak stack traces.
server.error.include-stacktrace=never

# SpringDoc OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# springdoc 2.6 calls a ControllerAdviceBean constructor removed in Spring Framework 7; with the
# global @RestControllerAdvice (ApiExceptionHandler) present, /api-docs would fail with 500.
springdoc.override-with-generic-response=false

# System prompt version for AI analysis (prompts/accessibility-<version>.txt)
app.ai.prompt-version=${AI_PROMPT_VERSION:v2}
