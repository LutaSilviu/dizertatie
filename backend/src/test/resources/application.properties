# Test defaults for every @SpringBootTest in this module.
#
# Flyway is disabled in tests, so Hibernate must create the schema itself:
# main's ddl-auto=validate would otherwise validate against an empty H2
# database and fail on the first missing table.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

APP_API_KEY=test-key
spring.ai.openai.api-key=test-key
